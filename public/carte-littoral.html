<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
.hdr {background:#111;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.brand {font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#F4C400}
.brand-sub {font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.15em;text-transform:uppercase;margin-top:2px}
.stats {display:flex;gap:20px}
.stat {display:flex;align-items:center;gap:7px;font-size:13px;color:rgba(255,255,255,.5)}
.dot {width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stat strong {color:#fff;font-weight:700}
.bar {background:#1A1A1A;padding:8px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;flex-wrap:wrap}
.btn {padding:6px 14px;border-radius:5px;border:1.5px solid;background:transparent;cursor:pointer;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;transition:all .15s}
.btn.c {border-color:#2B7BE9;color:#2B7BE9} .btn.c.on {background:#2B7BE9;color:#fff}
.btn.ci {border-color:#E93B2B;color:#E93B2B} .btn.ci.on {background:#E93B2B;color:#fff}
.s {padding:6px 11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#fff;font-size:12px;width:200px;outline:none}
.s::placeholder {color:rgba(255,255,255,.28)} .s:focus {border-color:#F4C400}
.vc {margin-left:auto;font-size:11px;color:rgba(255,255,255,.28)}
#map {flex:1}
.leaflet-popup-content-wrapper {background:#1C1C1C!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:8px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;color:#fff!important;padding:0!important}
.leaflet-popup-tip {background:#1C1C1C!important}
.leaflet-popup-content {margin:0!important;min-width:190px}
.p {padding:13px 15px}
.pt {font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
.pn {font-size:14px;font-weight:700;margin-bottom:7px;line-height:1.3}
.pm {font-size:11.5px;color:rgba(255,255,255,.45);line-height:1.65}
.pl {display:block;margin-top:7px;font-size:11px;color:#F4C400;text-decoration:none;word-break:break-all}
.ftr {background:#111;border-top:1px solid rgba(255,255,255,.06);padding:6px 20px;font-size:10px;color:rgba(255,255,255,.2);display:flex;justify-content:space-between;flex-shrink:0}
</style>
</head>
<body>
<div class="hdr">

</div>
<div class="bar">

  <div class="vc" id="vc"></div>
</div>
<div id="map"></div>

const map=L.map('map',{center:[46.5,2.5],zoom:6});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
const mk=col=>L.divIcon({className:'',html:`<div style="width:9px;height:9px;background:${col};border-radius:50%;border:2px solid rgba(255,255,255,.75);box-shadow:0 0 5px ${col}88"></div>`,iconSize:[9,9],iconAnchor:[4,4]});
const IC={camping:mk('#2B7BE9'),cinema:mk('#E93B2B')};
const grp={camping:L.layerGroup().addTo(map),cinema:L.layerGroup().addTo(map)};
const all={camping:[],cinema:[]};
function pop(d){
  const col=d.type==='camping'?'#2B7BE9':'#E93B2B';
  const lbl=d.type==='camping'?'Camping':'Cinéma';
  const x=d.type==='camping'?(d.stars?`<div>⭐ ${d.stars} étoiles</div>`:''+(d.capacity?`<div>👥 ${d.capacity} empl.</div>`:'')):''
  return`<div class="p"><div class="pt" style="color:${col}">${lbl}</div><div class="pn">${d.name}</div><div class="pm"><div>📍 ${d.zone}</div>${x}${d.phone?`<div>📞 ${d.phone}</div>`:''}</div>${d.website?`<a class="pl" href="${d.website}" target="_blank">🔗 ${d.website.replace(/https?:\/\//,'').split('/')[0]}</a>`:''}</div>`;
}
function add(data,type){
  data.forEach(d=>{const m=L.marker([d.lat,d.lng],{icon:IC[type]}).bindPopup(pop(d),{maxWidth:270});m._d=d;all[type].push(m);grp[type].addLayer(m);});
  document.getElementById(type==='camping'?'nc':'nci').textContent=data.length;
}
add(C,'camping');add(CI,'cinema');upd();
function tog(t,btn){btn.classList.toggle('on');btn.classList.contains('on')?map.addLayer(grp[t]):map.removeLayer(grp[t]);upd();}
function srch(q){q=q.toLowerCase();['camping','cinema'].forEach(t=>{grp[t].clearLayers();all[t].forEach(m=>{if(!q||m._d.name.toLowerCase().includes(q)||m._d.zone.toLowerCase().includes(q))grp[t].addLayer(m);});});upd();}
function upd(){document.getElementById('vc').textContent=(grp.camping.getLayers().length+grp.cinema.getLayers().length)+' points affichés';}
